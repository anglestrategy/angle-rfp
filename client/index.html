<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&family=Urbanist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        background: #000;
        color: #fff;
        font-family: "Urbanist", sans-serif;
        overflow-x: hidden;
      }

      ::selection {
        background: rgba(255, 90, 54, 0.25);
      }

      :focus-visible {
        outline: 2px solid #ff5a36;
        outline-offset: 2px;
      }

      html {
        scroll-behavior: smooth;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
    <title>angle/rfp</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GSAP + Tailwind v4 compatibility: suppress color/transform parse errors
      // Must be inline (not module) to run before any Vite plugins or modules load
      window.addEventListener('error', function(e) {
        if (e.message &&
            (e.message.indexOf("reading 'map'") !== -1 || e.message.indexOf("reading '0'") !== -1) &&
            e.error && e.error.stack && e.error.stack.indexOf('gsap') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
